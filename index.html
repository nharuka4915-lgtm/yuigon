

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遺言の種類 暗記アプリ</title>

<style>
:root {
  --red: #d71920;
  --line: #ddd;
  --soft: #f5f5f5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px 14px 30px;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  color: #222;
  background: white;
}
main { max-width: 620px; margin: 0 auto; }
h1 { font-size: 1.3rem; margin: 0 0 8px; }
.note {
  color: #555;
  font-size: .92rem;
  line-height: 1.5;
  margin-bottom: 16px;
}
.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-bottom: 16px;
}
.tab {
  padding: 11px 5px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background: white;
  font-size: .9rem;
  font-weight: 600;
}
.tab.active {
  background: #222;
  color: white;
  border-color: #222;
}
.card {
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.card-title {
  padding: 15px 14px;
  font-size: 1.1rem;
  font-weight: 700;
  background: var(--soft);
  border-bottom: 1px solid var(--line);
}
.item {
  display: grid;
  grid-template-columns: minmax(105px, 34%) 1fr;
  gap: 10px;
  padding: 13px 12px;
  border-bottom: 1px solid #eee;
  align-items: start;
}
.item:last-child { border-bottom: 0; }
.label { font-weight: 600; color: #444; }
.answer { line-height: 1.8; }
.reveal {
  display: inline;
  border: 0;
  padding: 1px 3px;
  border-radius: 4px;
  background: transparent;
  color: var(--red);
  font-weight: 700;
  font-size: 1rem;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
}
.reveal.hidden {
  color: transparent;
  background: #eee;
  text-decoration: none;
  user-select: none;
}
.reveal.hidden::after {
  content: "タップ";
  color: #777;
  font-size: .8rem;
  font-weight: 500;
}
.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 14px 0 10px;
}
.tool {
  padding: 9px 12px;
  border: 1px solid #ccc;
  border-radius: 9px;
  background: white;
  font-size: .92rem;
}
.status { font-size: .85rem; color: #666; }
@media (max-width: 380px) {
  body { padding: 14px 9px 24px; }
  .item { grid-template-columns: 100px 1fr; gap: 7px; }
  .tab { font-size: .82rem; }
}
</style>
</head>

<body>
<main>
  <h1>遺言の種類 暗記アプリ</h1>
  <p class="note">
    遺言の種類をひとつずつ表示。
    赤字をタップすると答えが見え、もう一度タップすると隠れます。
  </p>

  <nav class="tabs">
    <button class="tab active" data-kind="hand">自筆証書</button>
    <button class="tab" data-kind="public">公正証書</button>
    <button class="tab" data-kind="secret">秘密証書</button>
  </nav>

  <section class="card" id="card"></section>

  <div class="tools">
    <button class="tool" id="hideAll">このページをすべて隠す</button>
    <button class="tool" id="showAll">このページをすべて表示</button>
  </div>
  <p class="status" id="status"></p>
</main>

<script>
const data = {
  hand: {
    title: "自筆証書遺言",
    rows: [
      ["証人", [["不要", true]]],
      ["証人になれない人", [["―", false]]],
      ["検認", [
        ["必要", true], ["（", false], ["法務局", true],
        ["保管なら", false], ["不要", true], ["）", false]
      ]],
      ["保管", [["法務局", true], ["にすることができる", false]]],
      ["署名・押印", [["必要", true]]]
    ]
  },
  public: {
    title: "公正証書遺言",
    rows: [
      ["証人", [["2人", true], ["以上", false]]],
      ["証人になれない人", [
        ["①", false], ["未成年者", true], ["　②", false],
        ["推定相続人", true], ["　③", false], ["受遺者", true],
        ["　④(②③の)", false], ["配偶者", true],
        ["や", false], ["直系血族", true], ["など", false]
      ]],
      ["検認", [["不要", true]]],
      ["保管", [["公証役場", true]]],
      ["署名・押印", [["不要", true]]]
    ]
  },
  secret: {
    title: "秘密証書遺言",
    rows: [
      ["証人", [["2人", true], ["以上", false]]],
      ["証人になれない人", [
        ["①", false], ["未成年者", true], ["　②", false],
        ["推定相続人", true], ["　③", false], ["受遺者", true],
        ["　④(②③の)", false], ["配偶者", true],
        ["や", false], ["直系血族", true], ["など", false]
      ]],
      ["検認", [["必要", true]]],
      ["保管", [["―", false]]],
      ["署名・押印", [["必要", true]]]
    ]
  }
};

const card = document.getElementById("card");
const tabs = [...document.querySelectorAll(".tab")];
const status = document.getElementById("status");
let current = "hand";

function render(kind) {
  current = kind;
  tabs.forEach(tab => {
    tab.classList.toggle("active", tab.dataset.kind === kind);
  });

  const entry = data[kind];
  card.innerHTML =
    `<div class="card-title">${entry.title}</div>` +
    entry.rows.map(([label, parts]) =>
      `<div class="item">
        <div class="label">${label}</div>
        <div class="answer">${
          parts.map(([text, red]) => red
            ? `<button class="reveal hidden" type="button">${text}</button>`
            : `<span>${text}</span>`
          ).join("")
        }</div>
      </div>`
    ).join("");

  card.querySelectorAll(".reveal").forEach(button => {
    button.addEventListener("click", () => {
      button.classList.toggle("hidden");
      updateStatus();
    });
  });

  updateStatus();
}

function setAll(hide) {
  card.querySelectorAll(".reveal").forEach(button => {
    button.classList.toggle("hidden", hide);
  });
  updateStatus();
}

function updateStatus() {
  const answers = [...card.querySelectorAll(".reveal")];
  const visible = answers.filter(
    button => !button.classList.contains("hidden")
  ).length;

  status.textContent =
    `${data[current].title}：${visible} / ${answers.length} 個の答えを表示中`;
}

tabs.forEach(tab => {
  tab.addEventListener("click", () => render(tab.dataset.kind));
});

document.getElementById("hideAll").addEventListener("click", () => setAll(true));
document.getElementById("showAll").addEventListener("click", () => setAll(false));

render("hand");
</script>
</body>
</html>
